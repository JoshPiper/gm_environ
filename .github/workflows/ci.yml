name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly build to catch toolchain and dependency drift while the repo is quiet.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --check

      - name: Clippy (server)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Clippy (client)
        run: cargo clippy --all-targets --locked --features gmcl -- -D warnings

  build:
    name: Build
    uses: ./.github/workflows/build.yml

  test-linux64:
    name: GluaTest (x86-64 branch)
    needs: build
    uses: CFC-Servers/GLuaTest/.github/workflows/run_tests.yml@main
    with:
      branch: x86-64
      download-artifact: gmsv_environ_linux64.dll
      # additional-setup runs on the Actions runner, not inside the test
      # container, so it can't export a variable the server process would
      # see. It does run after GLuaTest is cloned into gluatest/ and before
      # that clone's `docker compose up`, though, and compose merges a
      # docker-compose.override.yml sitting next to docker-compose.yml. So
      # we write one there to put known values into the container's
      # environment for the get_csv() tests to read.
      additional-setup: |
        mkdir -p "$GITHUB_WORKSPACE/garrysmod_override/lua/bin"
        cp "$GITHUB_WORKSPACE/gluatest/docker/_gluatest_artifacts/gmsv_environ_linux64.dll" "$GITHUB_WORKSPACE/garrysmod_override/lua/bin/"
        cat > "$GITHUB_WORKSPACE/gluatest/docker/docker-compose.override.yml" <<'EOF'
        services:
          runner:
            environment:
              - 'GM_ENVIRON_TEST_CSV=foo, bar ,,baz'
              - 'GM_ENVIRON_TEST_QUOTED_CSV=foo,"bar,baz",qux'
        EOF

  test-linux32:
    name: GluaTest (main branch)
    needs: build
    uses: CFC-Servers/GLuaTest/.github/workflows/run_tests.yml@main
    with:
      download-artifact: gmsv_environ_linux.dll
      # See the x86-64 job above for why additional-setup writes a compose override.
      additional-setup: |
        mkdir -p "$GITHUB_WORKSPACE/garrysmod_override/lua/bin"
        cp "$GITHUB_WORKSPACE/gluatest/docker/_gluatest_artifacts/gmsv_environ_linux.dll" "$GITHUB_WORKSPACE/garrysmod_override/lua/bin/"
        cat > "$GITHUB_WORKSPACE/gluatest/docker/docker-compose.override.yml" <<'EOF'
        services:
          runner:
            environment:
              - 'GM_ENVIRON_TEST_CSV=foo, bar ,,baz'
              - 'GM_ENVIRON_TEST_QUOTED_CSV=foo,"bar,baz",qux'
        EOF
